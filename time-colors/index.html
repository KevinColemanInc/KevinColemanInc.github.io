<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171514" />
  <title>Time Colors — Calendar Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171514'/%3E%3Cpath d='M7 10h18M10 7v6m12-6v6M8 14h16v11H8z' fill='none' stroke='%23ffbd6e' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #1c1917; --muted: #746d68; --paper: #f6f3ee; --line: #ded8d0; --shadow: 0 20px 60px rgba(54, 43, 32, .10); }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: radial-gradient(circle at 14% -10%, #ffe3b0 0, transparent 25rem), radial-gradient(circle at 90% 0%, #ffd2c2 0, transparent 29rem), var(--paper); font: 16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; } button { cursor: pointer; } .shell { max-width: 1480px; margin: 0 auto; padding: 34px 28px 52px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 28px; padding: 0 2px 28px; } h1 { font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: -.065em; line-height: .93; margin: 0; } .eyebrow { text-transform: uppercase; letter-spacing: .13em; font-size: .72rem; font-weight: 800; color: #a85e35; margin: 0 0 10px; } .hint { color: var(--muted); max-width: 470px; margin: 0; font-size: .94rem; }
    .workspace { display: grid; grid-template-columns: 292px minmax(0, 1fr); gap: 20px; align-items: start; }.panel { background: rgba(255,255,255,.74); border: 1px solid rgba(117, 94, 75, .15); box-shadow: var(--shadow); border-radius: 22px; }.controls { padding: 20px; position: sticky; top: 16px; }.section-title { margin: 0 0 13px; font-size: .78rem; text-transform: uppercase; letter-spacing: .11em; color: #766b63; font-weight: 800; }.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 24px; }.field label { display: block; font-size: .76rem; font-weight: 750; color: #665e57; margin: 0 0 5px; }.field input { width: 100%; padding: 8px; border-radius: 9px; border: 1px solid var(--line); color: var(--ink); background: #fffdf9; min-height: 40px; }.field input:focus, .label-name:focus { outline: 3px solid rgba(231, 118, 69, .2); border-color: #d87a48; }
    .date-control { position: relative; height: 40px; }.field .date-control input { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }.date-display { position: absolute; inset: 0; display: flex; align-items: center; padding: 8px 34px 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fffdf9; font-weight: 700; pointer-events: none; }.date-control:focus-within .date-display { outline: 3px solid rgba(231, 118, 69, .2); border-color: #d87a48; }.calendar-glyph { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #776d65; font-size: 1rem; pointer-events: none; }
    .label-list { display: grid; gap: 8px; }.label-row { display: grid; grid-template-columns: 20px 1fr 28px; gap: 9px; align-items: center; padding: 8px; border-radius: 12px; border: 1px solid transparent; }.label-row.selected { background: #fffaf3; border-color: #e7d7c7; }.color-dot { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.10); }.label-name { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 4px 5px; color: var(--ink); min-width: 0; }.label-row button { width: 27px; height: 27px; padding: 0; display: grid; place-items: center; color: #8b8179; border: none; border-radius: 7px; background: transparent; }.label-row button:hover { background: #f1ebe3; color: #ab4c3d; }.add-label { width: 100%; margin-top: 12px; padding: 9px; border: 1px dashed #c9bdb2; border-radius: 10px; background: transparent; color: #6d5c50; font-size: .85rem; font-weight: 700; }.add-label:hover { background: #fff9f1; border-color: #bf8358; }.instruction { font-size: .79rem; color: var(--muted); margin: 20px 0 0; padding-top: 17px; border-top: 1px solid var(--line); }.instruction strong { color: #564c45; }
    .canvas { min-width: 0; overflow: hidden; }.toolbar { min-height: 79px; padding: 18px 21px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; justify-content: space-between; }.active-label { display: inline-flex; align-items: center; gap: 9px; font-size: .91rem; font-weight: 750; }.active-label .color-dot { width: 13px; height: 13px; border-radius: 4px; }.toolbar-actions { display: flex; gap: 8px; }.toolbar-actions button { border: 1px solid var(--line); background: #fffdf9; color: #655c56; padding: 8px 11px; border-radius: 9px; font-size: .78rem; font-weight: 700; }.toolbar-actions button:hover { background: #f8eee3; }.calendar { min-width: 0; padding: 20px; display: grid; gap: 26px; user-select: none; }.month { min-width: 0; }.month-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }.month-heading h2 { font-size: 1.06rem; margin: 0; letter-spacing: -.02em; }.month-heading span { color: var(--muted); font-size: .78rem; }.weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; min-width: 0; width: 100%; }.weekdays { margin-bottom: 5px; }.weekdays div { min-width: 0; color: #8b8179; font-size: .67rem; font-weight: 800; text-align: right; padding: 0 5px; text-transform: uppercase; letter-spacing: .05em; }.weekdays div:first-child, .weekdays div:last-child { color: #b36a48; }.day, .day-blank { min-height: 74px; }.day { position: relative; isolation: isolate; width: 100%; min-width: 0; min-inline-size: 0; max-width: 100%; appearance: none; -moz-appearance: none; padding: 8px; overflow: hidden; border: 1px solid #ebe6df; border-radius: 11px; background: #fffefa; text-align: left; color: #6d655e; touch-action: none; transition: transform .12s ease, box-shadow .12s ease; }.day.in-range { color: #342f2b; }.day.in-range:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(70, 48, 30, .12); }.day.outside { opacity: .26; pointer-events: none; }.day-number { position: relative; z-index: 1; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: .75rem; font-weight: 800; background: rgba(255,255,255,.68); }.day.weekend .day-number { color: #a24e39; }.day.assigned .day-number { background: rgba(255,255,255,.78); }.day-label { z-index: 1; position: absolute; left: 8px; right: 8px; bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(30, 22, 17, .76); font-size: .68rem; font-weight: 850; letter-spacing: .02em; }.day:focus-visible { outline: 3px solid #362b24; outline-offset: 2px; }.transition-mark { position: absolute; inset: 0; z-index: -1; opacity: .95; }
    .stats { margin-top: 20px; border-top: 1px solid var(--line); padding: 19px 0 0; }.stats h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: #766b63; margin: 0 0 12px; }.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 9px; }.stat { padding: 13px; border: 1px solid #e6dfd7; border-radius: 12px; background: #fffdf9; }.stat-head { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 800; }.stat-head .color-dot { width: 12px; height: 12px; border-radius: 4px; }.stat-values { display: flex; gap: 14px; margin-top: 10px; }.metric { display: grid; gap: 1px; }.metric strong { font-size: 1.32rem; line-height: 1; letter-spacing: -.04em; }.metric span { font-size: .67rem; color: var(--muted); font-weight: 700; }.empty-stats { color: var(--muted); margin: 0; font-size: .9rem; }
    .calendar-glyph { width: 16px; height: 15px; border: 2px solid #776d65; border-radius: 3px; color: transparent; }.calendar-glyph::before { content: ''; position: absolute; top: 3px; left: -2px; right: -2px; border-top: 2px solid #776d65; }.calendar-glyph::after { content: ''; position: absolute; top: -4px; left: 2px; width: 8px; height: 3px; border-left: 2px solid #776d65; border-right: 2px solid #776d65; }
    .toolbar-actions { align-items: center; }.toolbar-actions #share { border-color: #b96b41; background: #433027; color: #fffaf4; }.toolbar-actions #share:hover { background: #633d2d; }.toolbar-actions #share-status { color: #84766c; font-size: .72rem; font-weight: 700; }.weekdays div:nth-child(6), .weekdays div:nth-child(7) { color: #a65335; }.day.friday-saturday { border-color: #c78a62; box-shadow: inset 0 0 0 1px rgba(119, 69, 35, .16); }.day.friday-saturday:not(.assigned) { background: #fff4e9; }.day.friday-saturday .day-number { color: #93472f; }
    @media (max-width: 800px) { .shell { padding: 23px 14px 40px; } header { align-items: start; flex-direction: column; padding-bottom: 19px; gap: 14px; } .workspace { grid-template-columns: 1fr; } .controls { position: static; } .label-list { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); } .field-grid { max-width: 420px; } .day { min-height: 61px; padding: 6px; border-radius: 8px; } .day-label { display: none; } .calendar { padding: 14px; gap: 20px; } .weekdays, .days { gap: 3px; } .weekdays div { padding: 0 2px; font-size: .58rem; } .toolbar { padding: 14px; min-height: auto; align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">Time planner</p><h1>Paint your calendar.</h1></div>
      <p class="hint">Choose a label, then click or drag to paint a continuous run of days. The first day of every color change becomes a split-color transition.</p>
    </header>
    <div class="workspace">
      <aside class="panel controls" aria-label="Planner controls">
        <h2 class="section-title">Date range</h2>
        <div class="field-grid"><div class="field"><label for="start-date">Start</label><div class="date-control"><input id="start-date" type="date" aria-describedby="start-date-display" /><span id="start-date-display" class="date-display"></span><span class="calendar-glyph" aria-hidden="true"></span></div></div><div class="field"><label for="end-date">End</label><div class="date-control"><input id="end-date" type="date" aria-describedby="end-date-display" /><span id="end-date-display" class="date-display"></span><span class="calendar-glyph" aria-hidden="true"></span></div></div></div>
        <h2 class="section-title">Labels</h2><div id="label-list" class="label-list"></div><button id="add-label" class="add-label" type="button">+ Add a color</button>
        <p class="instruction"><strong>Tip:</strong> Transition days count as a full day for each adjacent color in the totals below.</p>
        <section class="stats" aria-live="polite"><h2>Time by color</h2><div id="stats"></div></section>
      </aside>
      <section class="panel canvas" aria-label="Calendar planner">
        <div class="toolbar"><div id="active-label" class="active-label"></div><div class="toolbar-actions"><span id="share-status" role="status" aria-live="polite"></span><button type="button" id="share">Share</button><button type="button" id="clear">Clear days</button><button type="button" id="fill-weekdays">Fill weekdays</button></div></div>
        <div id="calendar" class="calendar"></div>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const palette = ['#d99253', '#c97663', '#a96a7f', '#927487', '#b6835a', '#c9897a', '#a9705c', '#96717d'];
      const legacyPalette = { '#f2a04c': palette[0], '#df6b52': palette[1], '#bd4a69': palette[2], '#9b668f': palette[3], '#c77b38': palette[4], '#e48d82': palette[5], '#b86544': palette[6], '#ad7d47': palette[7] };
      const initialStart = new Date(); initialStart.setHours(0, 0, 0, 0);
      const initialEnd = new Date(initialStart); initialEnd.setDate(initialEnd.getDate() + 90);
      const state = { labels: [{ id: 'focus', name: 'Focus', color: palette[0] }, { id: 'life', name: 'Life', color: palette[1] }, { id: 'rest', name: 'Rest', color: palette[2] }], active: 'focus', assignments: {}, dragging: false, dragStart: null, dragOriginal: null, lastPainted: null };
      const $ = (id) => document.getElementById(id); const dateInput = (date) => [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
      $('start-date').value = dateInput(initialStart); $('end-date').value = dateInput(initialEnd);
      const localDate = (key) => { const [y,m,d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
      function renderDateDisplays() { ['start-date', 'end-date'].forEach(id => { const value = $(id).value; $(`${id}-display`).textContent = value ? localDate(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'Choose date'; }); }
      const keyFor = (date) => [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
      const addDays = (date, number) => { const next = new Date(date); next.setDate(next.getDate() + number); return next; };
      const range = () => ({ start: localDate($('start-date').value), end: localDate($('end-date').value) });
      const inRange = (date) => { const {start,end} = range(); return date >= start && date <= end; };
      const label = (id) => state.labels.find(item => item.id === id);
      const formatCount = (n) => Number.isInteger(n) ? n : n.toFixed(1);
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      const storageKey = 'time-colors-plan-v1';
      function planData() { return { start: $('start-date').value, end: $('end-date').value, labels: state.labels, assignments: state.assignments }; }
      function persistPlan() { try { localStorage.setItem(storageKey, JSON.stringify(planData())); } catch (_) {} }
      function encodePlan() { const bytes = new TextEncoder().encode(JSON.stringify(planData())); let binary = ''; bytes.forEach(byte => binary += String.fromCharCode(byte)); return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
      function decodePlan(value) { const base64 = value.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((value.length + 3) % 4); const binary = atob(base64); return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, char => char.charCodeAt(0)))); }
      function restorePlan(plan) { if (!plan || !Array.isArray(plan.labels) || !plan.labels.length) return; const labels = plan.labels.slice(0, 12).map((item, index) => { const color = /^#[0-9a-fA-F]{6}$/.test(item.color) ? item.color : palette[index % palette.length]; return { id: String(item.id || `label-${index}`).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || `label-${index}`, name: String(item.name || 'Untitled').slice(0, 50), color: legacyPalette[color.toLowerCase()] || color }; }); const ids = new Set(labels.map(item => item.id)); const assignments = Object.fromEntries(Object.entries(plan.assignments || {}).filter(([key, id]) => /^\d{4}-\d{2}-\d{2}$/.test(key) && ids.has(id))); state.labels = labels; state.active = labels[0].id; state.assignments = assignments; if (/^\d{4}-\d{2}-\d{2}$/.test(plan.start)) $('start-date').value = plan.start; if (/^\d{4}-\d{2}-\d{2}$/.test(plan.end)) $('end-date').value = plan.end; }
      function restoreSavedPlan() { try { const shared = new URLSearchParams(location.search).get('plan'); restorePlan(shared ? decodePlan(shared) : JSON.parse(localStorage.getItem(storageKey))); } catch (_) {} }
      function sharePlan() { const url = new URL(location.href); url.searchParams.set('plan', encodePlan()); history.replaceState({}, '', url); const status = $('share-status'); navigator.clipboard?.writeText(url.href).then(() => { status.textContent = 'Link copied'; }).catch(() => { status.textContent = 'Link ready in address bar'; }); if (!navigator.clipboard) status.textContent = 'Link ready in address bar'; }
      function renderLabels() {
        $('label-list').innerHTML = state.labels.map(item => `<div class="label-row ${item.id === state.active ? 'selected' : ''}" data-id="${item.id}"><span class="color-dot" style="background:${item.color}"></span><input class="label-name" aria-label="Label name" value="${escapeHtml(item.name)}" /><button type="button" aria-label="Remove ${escapeHtml(item.name)}">×</button></div>`).join('');
        const active = label(state.active) || state.labels[0]; if (!active) return; state.active = active.id;
        $('active-label').innerHTML = `<span class="color-dot" style="background:${active.color}"></span>Painting <span>${escapeHtml(active.name)}</span>`;
        document.querySelectorAll('.label-row').forEach(row => { row.addEventListener('click', (e) => { if (!e.target.matches('.label-name, button')) { state.active = row.dataset.id; renderAll(); } }); row.querySelector('.label-name').addEventListener('change', (e) => { label(row.dataset.id).name = e.target.value.trim() || 'Untitled'; renderAll(); }); row.querySelector('button').addEventListener('click', () => removeLabel(row.dataset.id)); });
      }
      function cellFill(key) {
        const current = state.assignments[key]; if (!current) return '';
        const previous = state.assignments[keyFor(addDays(localDate(key), -1))]; const currentLabel = label(current), previousLabel = label(previous);
        if (previous && previous !== current && previousLabel) return `background:linear-gradient(135deg, ${previousLabel.color} 0 48%, rgba(255,255,255,.86) 48% 52%, ${currentLabel.color} 52% 100%)`;
        return `background:${currentLabel.color}`;
      }
      function renderCalendar() {
        const {start, end} = range(); if (Number.isNaN(start) || Number.isNaN(end) || end < start) { $('calendar').innerHTML = '<p class="empty-stats">Choose a valid date range.</p>'; return; }
        const months = []; let cursor = new Date(start.getFullYear(), start.getMonth(), 1); const last = new Date(end.getFullYear(), end.getMonth(), 1);
        while (cursor <= last) { months.push(new Date(cursor)); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); }
        $('calendar').innerHTML = months.map(month => { const gridStart = addDays(month, -month.getDay()); const lastDay = new Date(month.getFullYear(), month.getMonth()+1, 0); const gridEnd = addDays(lastDay, 6-lastDay.getDay()); let cells = ''; for (let day = new Date(gridStart); day <= gridEnd; day = addDays(day, 1)) { if (day.getMonth() !== month.getMonth()) { cells += '<span class="day-blank" aria-hidden="true"></span>'; continue; } const key = keyFor(day), assigned = state.assignments[key], weekend = day.getDay() === 0 || day.getDay() === 6, fridaySaturday = day.getDay() === 5 || day.getDay() === 6; const assignedName = assigned ? escapeHtml(label(assigned).name) : ''; cells += `<button type="button" class="day ${inRange(day) ? 'in-range' : 'outside'} ${weekend ? 'weekend' : ''} ${fridaySaturday ? 'friday-saturday' : ''} ${assigned ? 'assigned' : ''}" data-date="${key}" aria-label="${day.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}${assigned ? ', '+assignedName : ''}" style="${assigned ? cellFill(key) : ''}"><span class="day-number">${day.getDate()}</span></button>`; } return `<section class="month"><div class="month-heading"><h2>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><span>${month.toLocaleDateString(undefined,{month:'short'})}</span></div><div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days">${cells}</div></section>`; }).join('');
        document.querySelectorAll('.day.in-range').forEach(day => { day.addEventListener('pointerdown', (event) => { event.preventDefault(); state.dragging = true; state.dragStart = day.dataset.date; state.dragOriginal = { ...state.assignments }; state.lastPainted = null; paintThrough(day.dataset.date); }); day.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); paintDay(day.dataset.date); } }); });
      }
      function paintDay(key) { state.assignments[key] = state.active; renderCalendar(); renderStats(); persistPlan(); }
      function paintThrough(key) { if (!state.dragStart || state.lastPainted === key) return; const anchor = localDate(state.dragStart), target = localDate(key); const first = anchor <= target ? anchor : target, last = anchor <= target ? target : anchor; state.assignments = { ...state.dragOriginal }; for (let day = new Date(first); day <= last; day = addDays(day, 1)) state.assignments[keyFor(day)] = state.active; state.lastPainted = key; renderCalendar(); renderStats(); persistPlan(); }
      function renderStats() {
        const stats = Object.fromEntries(state.labels.map(item => [item.id, { days: 0, weekends: 0, weekdays: 0 }]));
        Object.entries(state.assignments).forEach(([key, id]) => { const current = stats[id]; const date = localDate(key); if (!current || !inRange(date)) return; const isWeekend = [0,6].includes(date.getDay()), previous = state.assignments[keyFor(addDays(date,-1))]; const split = previous && previous !== id && stats[previous]; const add = (target, amount) => { target.days += amount; target[isWeekend ? 'weekends' : 'weekdays'] += amount; }; if (split) { add(stats[previous], 1); add(current, 1); } else add(current, 1); });
        const populated = state.labels.filter(item => stats[item.id].days > 0); $('stats').innerHTML = populated.length ? `<div class="stat-grid">${populated.map(item => { const s = stats[item.id]; return `<article class="stat"><div class="stat-head"><span class="color-dot" style="background:${item.color}"></span>${escapeHtml(item.name)}</div><div class="stat-values"><div class="metric"><strong>${formatCount(s.days)}</strong><span>days</span></div><div class="metric"><strong>${formatCount(s.weekends)}</strong><span>weekend</span></div><div class="metric"><strong>${formatCount(s.weekdays)}</strong><span>weekdays</span></div></div></article>`; }).join('')}</div>` : '<p class="empty-stats">Paint a few days to see your time split.</p>';
      }
      function renderAll() { renderDateDisplays(); renderLabels(); renderCalendar(); renderStats(); persistPlan(); }
      function removeLabel(id) { if (state.labels.length === 1) return; state.labels = state.labels.filter(item => item.id !== id); Object.keys(state.assignments).forEach(key => { if (state.assignments[key] === id) delete state.assignments[key]; }); if (state.active === id) state.active = state.labels[0].id; renderAll(); }
      $('add-label').addEventListener('click', () => { const number = state.labels.length + 1; const item = { id: `label-${Date.now()}`, name: `Label ${number}`, color: palette[(number - 1) % palette.length] }; state.labels.push(item); state.active = item.id; renderAll(); });
      $('clear').addEventListener('click', () => { state.assignments = {}; renderAll(); }); $('fill-weekdays').addEventListener('click', () => { const {start,end} = range(); for (let day = new Date(start); day <= end; day = addDays(day,1)) if (![0,6].includes(day.getDay())) state.assignments[keyFor(day)] = state.active; renderAll(); }); $('share').addEventListener('click', sharePlan);
      ['start-date','end-date'].forEach(id => $(id).addEventListener('change', () => { const {start,end} = range(); if (end < start) { if (id === 'start-date') $('end-date').value = $('start-date').value; else $('start-date').value = $('end-date').value; } renderAll(); })); window.addEventListener('pointermove', event => { if (!state.dragging) return; const cell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.day.in-range'); if (cell) paintThrough(cell.dataset.date); }); window.addEventListener('pointerup', () => { state.dragging = false; state.dragStart = null; state.dragOriginal = null; }); restoreSavedPlan(); renderAll();
    })();
  </script>
</body>
</html>
