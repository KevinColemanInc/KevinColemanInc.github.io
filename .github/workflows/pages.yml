name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: .blog-audio-cache
          key: blog-audio-chatterbox-male-v1-${{ matrix.shard }}-of-8-${{ hashFiles('_posts/**', '_config.yml', '_layouts/post.html', 'plugins/jekyll-blog-audio/scripts/*') }}
          restore-keys: blog-audio-chatterbox-male-v1-${{ matrix.shard }}-of-8-
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r plugins/jekyll-blog-audio/scripts/requirements-blog-audio.txt
      - run: bundle exec ruby plugins/jekyll-blog-audio/scripts/build-blog-audio.rb
        env:
          JEKYLL_ENV: production
          JEKYLL_BLOG_AUDIO_SHARD: ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        with:
          name: blog-audio-cache-${{ matrix.shard }}
          path: .blog-audio-cache
          include-hidden-files: true
          retention-days: 1

  build:
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: blog-audio-cache-*
          merge-multiple: true
          path: .blog-audio-cache
      - run: |
          bundle exec ruby plugins/jekyll-blog-audio/scripts/build-blog-audio.rb
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
