---
layout: default
---

<div class="home">
  {{ content }}

  {% assign recent_posts = site.posts | slice: 1, 4 %}
  {% if recent_posts.size > 0 %}
    <section class="recent-posts" aria-labelledby="recent-posts-heading">
      <h2 id="recent-posts-heading">More recent posts</h2>
      <ul class="post-list">
        {% for post in recent_posts %}
          <li>
            <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
            <h3>
              <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
            </h3>
          </li>
        {% endfor %}
      </ul>
    </section>
  {% endif %}

  <p class="archive-link"><a href="{{ '/archive/' | relative_url }}">Browse all posts</a></p>
</div>
